<svg xmlns="http://www.w3.org/2000/svg" width="600pt" height="330pt" viewBox="0 0 600 330" font-family="'TeX Gyre Heros', 'Helvetica Neue', Helvetica, Arimo, Arial, sans-serif" font-size="11" fill="#243746" data-spec="ascend-workflow" data-spec-version="2">
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#52758c"/></marker></defs>
<g id="e:cube-path" data-kind="edge" data-from="workload" data-to="cube" data-edge-kind="data"><path d="M134 138 H154 V92 H174" fill="none" stroke="#52758c" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="140" y="81" font-size="9" fill="#52758c">MatMul</text>
</g>
<g id="e:vector-path" data-kind="edge" data-from="workload" data-to="vector" data-edge-kind="data"><path d="M134 154 H154 V200 H174" fill="none" stroke="#52758c" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="138" y="231" font-size="9" fill="#52758c">Epilogue</text>
</g>
<g id="e:join-cube" data-kind="edge" data-from="cube" data-to="compose" data-edge-kind="data"><path d="M284 92 H305 V138 H324" fill="none" stroke="#52758c" stroke-width="1.2" marker-end="url(#arrow)"/>
</g>
<g id="e:join-vector" data-kind="edge" data-from="vector" data-to="compose" data-edge-kind="data"><path d="M284 200 H305 V154 H324" fill="none" stroke="#52758c" stroke-width="1.2" marker-end="url(#arrow)"/>
</g>
<g id="e:check" data-kind="edge" data-from="compose" data-to="validate" data-edge-kind="data"><path d="M434 146 H468" fill="none" stroke="#52758c" stroke-width="1.2" marker-end="url(#arrow)"/>
</g>
<g id="e:accept" data-kind="edge" data-from="validate" data-to="deliver" data-edge-kind="data"><path d="M522 168 V244" fill="none" stroke="#52758c" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="529" y="212" font-size="9" fill="#52758c">Pass</text>
</g>
<g id="e:revise" data-kind="edge" data-from="validate" data-to="vector" data-edge-kind="feedback"><path d="M486 168 V234 H229 V220" fill="none" stroke="#52758c" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="280" y="249" font-size="9" fill="#52758c">Fail: refine Vector / tiling</text>
</g>
<g id="n:workload" data-kind="node" data-role="existing"><rect x="24" y="124" width="110" height="44" rx="4" fill="#eaf0f4" stroke="#52758c" stroke-width="1"/><text x="79" y="143.3" font-size="11" text-anchor="middle">Workload &amp;</text><text x="79" y="156.5" font-size="11" text-anchor="middle">constraints</text></g>
<g id="n:cube" data-kind="node" data-role="existing"><rect x="174" y="72" width="110" height="40" rx="4" fill="#eaf0f4" stroke="#52758c" stroke-width="1"/><text x="229.00" y="96.00" font-size="11" text-anchor="middle">Reuse Cube</text></g>
<g id="n:vector" data-kind="node" data-role="existing"><rect x="174" y="180" width="110" height="40" rx="4" fill="#eaf0f4" stroke="#52758c" stroke-width="1"/><text x="229.00" y="198.00" font-size="11" text-anchor="middle">Generate Vector</text><text x="229.00" y="211.20" font-size="11" text-anchor="middle">from workload</text></g>
<g id="n:compose" data-kind="node" data-role="existing"><rect x="324" y="124" width="110" height="44" rx="4" fill="#eaf0f4" stroke="#52758c" stroke-width="1"/><text x="379.00" y="148.90" font-size="11" text-anchor="middle">Compose C+V</text></g>
<g id="n:validate" data-kind="node" data-role="existing"><rect x="468" y="124" width="108" height="44" rx="4" fill="#eaf0f4" stroke="#52758c" stroke-width="1"/><text x="522.00" y="149.95" font-size="11" text-anchor="middle">Correct &amp; fast?</text></g>
<g id="n:deliver" data-kind="node" data-role="existing"><rect x="468" y="244" width="108" height="40" rx="4" fill="#e3f0ec" stroke="#52758c" stroke-width="1"/><text x="522.00" y="266.80" font-size="11" text-anchor="middle">Deliver operator</text></g>
<g id="a:title" data-kind="annotation"><text x="24" y="25" font-size="16" font-weight="bold">Ascend operator generation</text></g>
<g id="a:scope" data-kind="annotation"><text x="24" y="309" font-size="10">Reuse mature compute; validate the complete C+V path.</text></g>
</svg>
