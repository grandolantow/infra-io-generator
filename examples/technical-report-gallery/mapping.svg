<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" data-language-profile="diagram-en-prose-zh"><title data-text-role="diagram_title">Logical-to-Physical Mapping</title><desc data-text-role="prose">同时展示两组映射；交叉线表示物理顺序不同，不表示耗时或分配过程。</desc><metadata>{"diagram_id": "toy_mapping_language", "view_id": "mapping", "fact_ids": ["f_map0", "f_map1"]}</metadata><rect width="100%" height="100%" fill="#FFFFFF" /><defs><marker id="arrow-v_map0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563A0" /></marker><marker id="arrow-v_map1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#AE6517" /></marker></defs><polyline id="v_map0" data-semantic-ref="map0" points="300,177.5 570,287.5" fill="none" stroke="#2563A0" stroke-width="2.5" marker-end="url(#arrow-v_map0)" /><polyline id="v_map1" data-semantic-ref="map1" points="300,287.5 570,177.5" fill="none" stroke="#AE6517" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrow-v_map1)" /><g id="title" data-semantic-ref="" data-text-role="diagram_title"><text x="450.0" y="47.0" text-anchor="middle" dominant-baseline="middle" font-size="26" font-family="sans-serif" fill="#111827"><tspan x="450.0" dy="0">Same pages, different order</tspan></text></g><g id="left_heading" data-semantic-ref="" data-text-role="section_title"><text x="190.0" y="107.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-family="sans-serif" fill="#1F2937"><tspan x="190.0" dy="0">Logical order</tspan></text></g><g id="right_heading" data-semantic-ref="" data-text-role="section_title"><text x="680.0" y="107.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-family="sans-serif" fill="#1F2937"><tspan x="680.0" dy="0">Physical order</tspan></text></g><g id="v_L0" data-semantic-ref="L0" data-text-role="